name: PR CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'openapi.yaml'
              - 'Makefile'
              - '.github/workflows/pr-ci.yml'
            frontend:
              - 'frontend/**'
              - 'openapi.yaml'
              - 'Makefile'
              - '.github/workflows/pr-ci.yml'
            contract:
              - 'openapi.yaml'
              - 'backend/internal/api/**'
              - 'frontend/src/lib/api/**'
              - 'redocly.yaml'
              - 'Makefile'
              - '.github/workflows/pr-ci.yml'

  backend-ci:
    name: Backend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # gofmt check and go vet, including the integration-tagged tests.
      - name: Lint
        run: make lint-backend

      - name: Build
        run: make build-backend

      - name: Unit tests
        run: make test-backend

      - name: Validate Docker runtime
        run: docker version

      # PostgreSQL 17 through testcontainers (TESTING.md).
      - name: Integration tests
        run: make test-integration

  frontend-ci:
    name: Frontend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Unit tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

  contract-ci:
    name: OpenAPI contract
    needs: detect-changes
    if: needs.detect-changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lint openapi.yaml
        run: make openapi-lint

      # Fails if the committed generated Go and TypeScript code is stale.
      - name: Generated code is up to date
        run: make generate-check
