name: Build and Push

on:
  push:
    branches:
      - main
    paths:
      - backend/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1034155711710/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ci-deployer@evimaytools.iam.gserviceaccount.com

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev --quiet

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: australia-southeast1-docker.pkg.dev/evimaytools/marker/backend:latest

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1034155711710/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ci-deployer@evimaytools.iam.gserviceaccount.com

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: marker-backend
          region: australia-southeast1
          image: australia-southeast1-docker.pkg.dev/evimaytools/marker/backend:latest
          flags: --service-account=ci-deployer@evimaytools.iam.gserviceaccount.com

